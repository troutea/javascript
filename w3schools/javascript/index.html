<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
<h1> JavaScript Timers</h1>
<h2>The timeout Method</h2>

<button onclick="startTimer()">StartTimer</button>
<button onclick="stopTimer()">stopTimer</button>

<p id="demo"></p>

<script>
  let timer;

  function startTimer() {
  timer = setTimeout(function() {
    document.getElementById("demo").innerHTML = "Finished";
  }, 5000);
}

function stopTimer() {
  clearTimeout(timer);
  document.getElementById("demo").innerHTML = "Timer stopped";
}

// Function to display any text
function myDisplayer(text) {
  let demo = document.getElementById("demo"); 
  demo.innerHTML += text + "<br>";
}

</script>


  
</body>
</html>
