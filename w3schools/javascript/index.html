<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h1>Variables, Let, Const & Data Types</h1>
    <p id='letVariable'></p>
    <p id='constVariable'></p>
    <script>
         let letVariable = 10;
      const constVariable = 20;

      document.getElementById('letVariable').textContent = letVariable;
      document.getElementById('constVariable').textContent = constVariable;
    </script>
    
</body>
</html>
